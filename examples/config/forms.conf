-- Sample word forms for proposal 0001 (proposals/0001-support-recipes-in-any-language.md).
-- A starting point per language, not a complete table: a few common ingredients,
-- counting units and cookware each. Not yet checked by native speakers; corrections
-- are welcome.
--
-- Line: dictionary form | written form | ... ; `category=form` is also the form
-- printed after a number in that CLDR plural category.
-- Categories each language uses: de nl fi hu: one, other. fr es it pt: one, other
-- (`many` is for millions and falls back to `other`). ru uk pl: one, few, many, other
-- (`other` is for fractions). cs: one, few, many (fractions), other.

